---
input: What is the difference between `is` and `==` in Python?
output: >-
  `==` checks value equality — whether two objects have the same content.
  `is` checks object identity — whether two variables point to the exact
  same object in memory. Two separate lists with equal contents are `==`
  but not `is`. CPython caches small integers (-5 to 256) and interned
  strings, so `is` may return True for these unexpectedly — always use
  `==` for value comparisons.
