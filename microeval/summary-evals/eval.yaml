# Global configuration for all runs in summary-evals
# These settings apply to all run configs unless overridden in individual run files

# Service and model for LLM-based evaluators (equivalence, relevance_llm)
eval_chat_service: openai
eval_model: gpt-4o-mini

# Service and model for embedding-based evaluators (relevance_embedding)
eval_embed_service: openai
embed_model: text-embedding-3-small
