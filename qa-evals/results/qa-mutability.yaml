texts:
- "The mutable default argument trap in Python occurs when a function uses a mutable\
  \ object as a default argument, and changes to that object affect all future calls\
  \ to the function. This happens because default arguments are evaluated only once\
  \ at the point of function definition in the defining scope. \n\nTo avoid it, use\
  \ `None` as the default argument and initialize the mutable object inside the function:\n\
  \n```python\ndef append_to_list(element, list=None):\n    if list is None:\n   \
  \     list = []\n    list.append(element)\n    return list\n```"
