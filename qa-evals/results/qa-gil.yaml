texts:
- >-
  The Global Interpreter Lock (GIL) is a mechanism in Python that prevents multiple
  native threads from executing Python bytecodes at once. It affects multithreaded
  programs by limiting parallel execution of threads, making true parallelism in CPU-bound
  tasks impossible. However, it does allow for concurrent execution of I/O-bound tasks,
  as the GIL is released during I/O operations, allowing other threads to run.
